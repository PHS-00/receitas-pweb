<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Receita 5 - Arrow Functions e Constantes</title>
    <style>
        .btn-link {
            display: inline-block;
            padding: 8px 15px;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin-right: 5px;
        }

        .btn-link:hover {
            background-color: #219150;
        }

        .card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 8px;
            margin: 4px 0;
        }
    </style>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <nav>
        <a href="../index.html">
            <i class="bi bi-arrow-left"></i>
            Voltar
        </a>
    </nav>
    <h1>Refatoração com Arrow Functions</h1>
    <!-- Exercício 3: Links em vez de botões -->
    <a href="#" id="linkCarregar" class="btn-link">Carregar Cervejas</a>
    <a href="#" id="linkOrdenar" class="btn-link">Ordenar</a>
    <div id="meuamor" style="margin-top:20px;">Clique nos links acima.</div>
    <script>
        const cervejas = ["Guinness", "Desperados", "Becks", "Stella Artois"];
        // Exercício 1 & 2: Função refatorada aceitando parâmetro e usando arrow
        const carregarDiv = (cervs = cervejas, idAlvo = "meuamor") => {
            const divsHtml = cervs.map(item => `<div class="card">${item}</div>`).join("");
            document.getElementById(idAlvo).innerHTML = divsHtml;
        };
        const ordenarECarregar = () => {
            const ordenadas = [...cervejas].sort();
            carregarDiv(ordenadas);
        };
        document.getElementById("linkCarregar").addEventListener("click", (e) => {
            e.preventDefault();
            carregarDiv();
        });
        document.getElementById("linkOrdenar").addEventListener("click", (e) => {
            e.preventDefault();
            ordenarECarregar();
        });
    </script>
</body>
</html>
