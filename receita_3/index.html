<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Receita 3 - JavaScript no Navegador</title>
    <style>
        #conteudoDiv {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            transition: opacity 0.5s ease-in-out;
            opacity: 1;
        }

        .escondido {
            opacity: 0 !important;
        }
    </style>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <nav>
        <a href="../index.html">
            <i class="bi bi-arrow-left"></i>
            Voltar
        </a>
    </nav>
    <br>
    <br>
    <!-- Exercício 1: O botão fica numa div separada e permanece visível -->
    <div id="painelBotoes">
        <button id="btnCarregar">Alternar Cerveja (Guinness)</button>
    </div>
    <!-- Div para exibição da informação -->
    <div id="conteudoDiv">Clique no botão acima para carregar o conteúdo.</div>
    <script>
        let exibindo = false;
        function alternarCerveja() {
            let divArea = document.getElementById("conteudoDiv");

            // Exercício 3: Efeito de fade usando opacidade CSS
            divArea.classList.add("escondido");
            setTimeout(function () {
                // Exercício 2: Alterna entre exibir o nome e apagar a div
                if (!exibindo) {
                    divArea.innerHTML = "<h1>Guinness</h1>";
                    exibindo = true;
                } else {
                    divArea.innerHTML = "Conteúdo limpo.";
                    exibindo = false;
                }
                divArea.classList.remove("escondido");
            }, 300);
        }
        let botao = document.getElementById("btnCarregar");
        botao.addEventListener("click", alternarCerveja);
    </script>
</body>
</html>
