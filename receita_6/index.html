<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Receita 6 - Objetos JSON e Tabela Genérica</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #8e44ad;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <nav>
        <a href="../index.html">
            <i class="bi bi-arrow-left"></i>
            Voltar
        </a>
    </nav>
    <h1>Tabela Genérica de Objetos JSON</h1>
    <button id="btnCarregar">Carregar Cervejas (JSON)</button>
    <div id="cervejasDiv">Aguardando dados...</div>
    <script>
        // Exercício 3: Adicionando propriedades style e ibu
        const cervejas = [
            { name: "Guinness", alcohol: "4.2%", style: "Stout", ibu: "45 IBU" },
            { name: "Desperados", alcohol: "5.9%", style: "Tequila Lager", ibu: "20 IBU" },
            { name: "Becks", alcohol: "5.0%", style: "German Pilsner", ibu: "20 IBU" }, { name: "Eisenbahn IPA", alcohol: "6.9%", style: "American IPA", ibu: "50 IBU" }
        ];
        // Exercício 4, 5 e 6: Função genérica para qualquer array de objetos e id arbitrário
        const carregarTabelaGenerica = (
            itens = cervejas,
            idDiv = "cervejasDiv",
            colunas = ["name", "alcohol", "style", "ibu"],
            cabecalhos = ["Nome", "Álcool", "Estilo", "Amargor"]
        ) => {
            const cabecalhoHtml = cabecalhos.map(c => `<th>${c}</th>`).join("");

            const linhasHtml = itens.map(item => {
                const celulas = colunas.map(col => `<td>${item[col] || "-"}</td>`).join("");
                return `<tr>${celulas}</tr>`;
            }).join("");

            const tabela = `
                            <table>
                            <thead><tr>${cabecalhoHtml}</tr></thead>
                            <tbody>${linhasHtml}</tbody>
                            </table>
                            `;
            document.getElementById(idDiv).innerHTML = tabela;
        };
        document.getElementById("btnCarregar").addEventListener("click", () => carregarTabelaGenerica());
    </script>
</body>
</html>
