<!DOCTYPE html>

<body>
    <nav>

    <h1>Exercício 1 a 6 - Tabelas e Links</h1>
    <!-- Tabelas lado a lado usando tabela contêiner -->
    <table>
        <tr>
            <!-- Tabela 1: Bebidas Frias -->
            <td style="vertical-align: top; padding-right: 20px;">
                <h3>Bebidas Frias</h3>
                <table border="1" cellpadding="5" cellspacing="0">
                    <tr bgcolor="#f2f2f2">
                        <th>Bebida</th>
                        <th>Preço (R$)</th>
                    </tr>
                    <tr>
                        <td>Cerveja Pilsen</td>
                        <td>10,00</td>
                    </tr>
                    <tr>
                        <td>Suco Natural</td>
                        <td>8,00</td>
                    </tr>
                </table>
            </td>
            <!-- Tabela 2: Bebidas Quentes -->
            <td style="vertical-align: top;">
                <h3>Bebidas Quentes</h3>
                <table border="1" cellpadding="5" cellspacing="0">
                    <tr bgcolor="#f2f2f2">
                        <th>Bebida</th>
                        <th>Preço (R$)</th>
                    </tr>
                    <tr>
                        <td>Café Espresso</td>
                        <td>5,00</td>
                    </tr>
                    <tr>
                        <td>Chá de Hortelã</td>
                        <td>4,50</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
    <br>
    <hr><br>
    <h3>Links Úteis</h3>
